<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="container">
    <h1>Formulario</h1>

    <form id="registroForm" novalidate>
        <label><b>Nombre:</b></label>
        <input type="text" id="nombre"> <br><br>
        <small id="msgNombre"></small><br>

        <label><b>Correo:</b></label>
        <input type="email" id="correo"> <br><br>
        <small id="msgCorreo"></small><br>

        <label><b>Contraseña:</b></label>
        <input type="password" id="password"> <br><br>
        <small id="msgPassword"></small><br>

        <label><b>Confirmar contraseña:</b></label>
        <input type="password" id="confirmar"> <br><br>
        <small id="msgConfirmar"></small><br>

        <label><b>Edad:</b></label>
        <input type="number" id="edad"> <br><br>
        <small id="msgEdad"></small><br>


        <button type="submit" id="btnEnviar" disabled>Enviar</button>
        <button type="reset">Reiniciar</button>
    </form>
</div>

    <script src="script.js"></script>
</body>
</html>
